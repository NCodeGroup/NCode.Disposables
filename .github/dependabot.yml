# Dependabot, built into GitHub: each week, a pull request for every newer version, which CI tests and you merge.
# Minor and patch updates of one kind come together in a single pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
