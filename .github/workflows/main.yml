# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: ["published"]

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration ${BUILD_CONFIGURATION} /p:PublicRelease=${PUBLIC_RELEASE}
        env:
          PUBLIC_RELEASE: ${{ github.event_name == 'release' }}
      - name: Pack
        run: dotnet pack --no-build --configuration ${BUILD_CONFIGURATION} /p:PublicRelease=${PUBLIC_RELEASE}
        env:
          PUBLIC_RELEASE: ${{ github.event_name == 'release' }}
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: |
            ./*/*/bin/*
            ./*/*/obj/*
          if-no-files-found: error
          retention-days: 5

  test:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Run tests
        run: dotnet test --no-build --verbosity normal --configuration ${BUILD_CONFIGURATION} --logger trx
      - name: Summarize the test results
        if: success() || failure()
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Path tests -Filter *.trx -Recurse -File)
          $summary = @('## Test results', '')
          if (-not $reports.Count) { $summary += 'No test results were found.' }
          else {
            $summary += '| Project | Total | Passed | Failed | Not executed |', '| --- | ---: | ---: | ---: | ---: |'
            foreach ($report in $reports) {
              $counters = ([xml](Get-Content -LiteralPath $report.FullName -Raw)).TestRun.ResultSummary.Counters
              $summary += "| $($report.Directory.Parent.Name) | $($counters.total) | $($counters.passed) | $($counters.failed) | $($counters.notExecuted) |"
            }
          }
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

  publish:
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.tag_name
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
      - name: Upload release artifacts
        run: gh release upload "${TAG_NAME}" ./*/*/bin/${BUILD_CONFIGURATION}/*.nupkg ./*/*/bin/${BUILD_CONFIGURATION}/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Publish NuGet package
        run: dotnet nuget push ./*/*/bin/${BUILD_CONFIGURATION}/*.nupkg --api-key "${{ secrets.NUGET_APIKEY }}" --source https://api.nuget.org/v3/index.json
